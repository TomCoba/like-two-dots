<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Two Dots Clone</title>
    <style>
        body { font-family: sans-serif; }
        .grid {
            display: grid;
            grid-template-columns: repeat(6, 40px);
            grid-gap: 5px;
            margin-top: 20px;
        }
        .dot {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: gray;
        }
    </style>
</head>
<body>
    <h1>Two Dots (6x6)</h1>
    <div class="grid" id="grid"></div>

    <script>
        fetch('/api/board')
            .then(res => res.json())
            .then(board => {
                const grid = document.getElementById('grid');
                board.forEach(row => {
                    row.forEach(cell => {
                        const dot = document.createElement('div');
                        dot.className = 'dot';
                        dot.style.backgroundColor = cell;
                        grid.appendChild(dot);
                    });
                });
            });
    </script>
</body>
</html>
